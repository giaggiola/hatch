app = "hatch-api"
primary_region = "iad"

[build]

[env]
  DATABASE_URL = "sqlite+aiosqlite:///./data/hatch.db"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

[mounts]
  source = "hatch_data"
  destination = "/app/data"
